<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hydrocarbon Tank Reconciliation — Architecture Walkthrough</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --border: #2e3249;
    --accent: #4f8ef7;
    --accent2: #34c98a;
    --warn: #f5a623;
    --danger: #e05555;
    --purple: #a78bfa;
    --text: #e2e8f0;
    --muted: #8892a4;
    --card-h: 540px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Top bar ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 32px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .logo { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; color: var(--accent); }
  .logo span { color: var(--muted); font-weight: 400; }
  .controls { display: flex; gap: 10px; align-items: center; }
  button {
    background: var(--border); border: 1px solid #3a3f58; color: var(--text);
    border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 13px;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #2e3455; border-color: var(--accent); }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  button.primary:hover { background: #3a7de0; }
  button:disabled { opacity: 0.35; cursor: default; }
  .auto-btn.playing { background: #e05555; border-color: #e05555; color: #fff; }

  /* ── Progress dots ── */
  .nav-dots {
    display: flex; gap: 8px; align-items: center;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border); cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .dot.active { background: var(--accent); transform: scale(1.4); }
  .dot.done   { background: var(--accent2); }

  /* ── Slide container ── */
  .stage {
    max-width: 1400px; margin: 32px auto; padding: 0 24px;
  }

  .slide {
    display: none;
    animation: fadeSlideIn 0.5s ease forwards;
  }
  .slide.active { display: block; }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Slide header ── */
  .slide-header {
    margin-bottom: 28px;
  }
  .slide-num {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 6px;
  }
  .slide-title {
    font-size: 26px; font-weight: 700; line-height: 1.2;
  }
  .slide-sub {
    font-size: 14px; color: var(--muted); margin-top: 6px;
  }

  /* ── Flow card wrapper ── */
  .flow-wrapper {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── Landscape layout: SVG left, description right ── */
  .flow-body {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  /* SVG scrolls vertically inside a fixed-height box */
  .diagram {
    flex: 1 1 0;
    min-width: 0;
    max-height: 72vh;
    overflow-y: auto;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #0d1020;
    padding: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .diagram svg {
    display: block;
    /* let SVG use its natural width; height scales */
    max-width: 100%;
    height: auto;
  }

  /* Description panel — fixed width on the right */
  .side-panel {
    flex: 0 0 300px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ── Step-reveal animation ── */
  .step-node {
    opacity: 0;
    transform-origin: center;
  }
  .step-node.shown {
    animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }

  .step-edge {
    opacity: 0;
    /* dasharray/dashoffset set dynamically via JS after getTotalLength() */
  }
  .step-edge.shown {
    opacity: 1;
    /* animation injected inline by JS so each edge uses its own length */
  }
  .step-edge.dimmed {
    opacity: 0.18;
    transition: opacity 0.4s ease;
  }

  /* ── Step description panel ── */
  .step-desc {
    margin-top: 20px;
    background: #12151f;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 13px;
    line-height: 1.65;
    min-height: 56px;
    transition: opacity 0.3s;
  }
  .step-desc .tag {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.08em;
    padding: 2px 7px; border-radius: 4px;
    margin-right: 8px; vertical-align: middle;
  }
  .step-desc .tag.green  { background: var(--accent2); }
  .step-desc .tag.orange { background: var(--warn); }
  .step-desc .tag.red    { background: var(--danger); }
  .step-desc .tag.purple { background: var(--purple); }

  /* ── Step counter ── */
  .step-counter {
    font-size: 12px; color: var(--muted); text-align: right; margin-top: 10px;
  }

  /* ── Footer progress bar ── */
  .progress-bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 3px;
    background: var(--border);
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    transition: width 0.3s ease;
  }

  /* ── Slide transition ── */
  @keyframes slideOutLeft {
    to { opacity: 0; transform: translateX(-40px); }
  }
  .slide.leaving {
    animation: slideOutLeft 0.3s ease forwards;
  }
</style>
</head>
<body>

<header>
  <div class="logo">🛢 Tank Reconciliation <span>/ Architecture Walkthrough</span></div>
  <div class="nav-dots" id="navDots"></div>
  <div class="controls">
    <button id="prevBtn" onclick="navigate(-1)">← Prev</button>
    <button id="prevStepBtn" onclick="prevStep()">↩ Step</button>
    <button id="nextStepBtn" class="primary" onclick="nextStep()">Next Step →</button>
    <button id="nextSlideBtn" onclick="navigate(1)">Next Chart →</button>
    <button id="autoBtn" class="auto-btn" onclick="toggleAuto()">▶ Auto Play</button>
  </div>
</header>

<div class="stage" id="stage"></div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<script>
// ═══════════════════════════════════════════════════════════
// DATA — each slide has steps; each step reveals nodes/edges
// ═══════════════════════════════════════════════════════════

const SLIDES = [

// ── SLIDE 0: System Architecture ─────────────────────────────────────────────
{
  num: "01 / 04",

    { desc: '<span class="tag">ON-PREM</span> Three custom OData services expose IS-Oil data: <b>ZTANK_DIP_SRV_SRV</b> (dips, reason codes, nominations), <b>ZTANK_PLANT_SRV_SRV</b> (plants), <b>ZTANK_POST_SRV_SRV</b> (goods movement posting).', show: ["n-z1","n-z2","n-z3","e-oib-z1"] },

    { desc: '<span class="tag green">BTP</span> Two <b>LangGraph AI Agents</b>: the <b>Tank Reconciliation Agent</b> can autonomously create dip readings and trigger runs; the <b>Nomination ETA Agent</b> proposes risk-adjusted vessel ETAs.', show: ["n-ag-recon","n-ag-eta","e-ag-recon-mcp","e-ag-eta-mcp"] },
    { desc: '<span class="tag orange">EXTERNAL</span> <b>SAP AI Core</b> (GPT-4o / Claude) powers the AI chat, natural language dip extraction, and the ETA agent reasoning. Accessed via the <b>aicore</b> BTP Destination — credentials never leave BTP.', show: ["g-ext","n-aicore","e-dest-aicore","e-cap-aicore"] },

    { desc: '<span class="tag orange">EXTERNAL</span> <b>GDELT News API</b> scans 30 days of global headlines near a port to detect geopolitical risk (strikes, hurricanes, sanctions). <b>BTP ANS</b>, <b>MS Teams</b>, and <b>Email</b> handle alert distribution.', show: ["n-gdelt","n-ans","n-teams","e-eta-gdelt","e-n8n-ans","e-n8n-teams","e-abap-cap","e-ogs-cap"] },

// ── SLIDE 1: Reconciliation Pipeline ─────────────────────────────────────────
{
  num: "02 / 04",
  title: "Reconciliation Pipeline — M1 to M6",
  sub: "The 6-milestone automated pipeline from raw dip reading to posted material document",
  steps: [
    { desc: '<span class="tag">TRIGGER</span> Runs automatically at <b>6 AM daily</b> or on-demand from the React dashboard. Initiates the full 6-milestone pipeline.', show: ["n-trigger","e-trigger-m1"] },
    { desc: '<span class="tag green">M1</span> <b>Data Ingestion</b> — reads live tank dip measurements directly from <b>OIB_TANKDIP</b> in IS-Oil via ZTANK_DIP_SRV_SRV. Each record contains both the physical quantity and the corresponding book stock. If any configured tank is missing a dip, the run halts immediately and raises a URGENT alert.', show: ["n-m1","n-chk","e-m1-chk"] },

    { desc: '<span class="tag green">METHOD A</span> <b>Manual Entry</b> — operator selects the tank, fills in the form (dip type, value, unit, temperature, density, event), and clicks Save & Post to SAP. Simplest path, full operator control.', show: ["n-ma","e-user-ma"] },

    { desc: '<span class="tag purple">SAVE</span> All methods call <b>CAP: saveDipReading</b> — creates a record in HANA with status <b>DRAFT</b>. No data is ever lost even if the downstream SAP call fails.', show: ["n-save","e-ma-save","e-mb-save","e-mc-save","e-md-save"] },

    { desc: '<span class="tag green">POSTED</span> HTTP 2xx — dip reading successfully written to <b>OIB_TANKDIP</b> in IS-Oil. Record status updated to POSTED. The BAPI response code is stored in the dip record.', show: ["n-posted","e-status-posted"] },
    { desc: '<span class="tag red">FAILED</span> HTTP 4xx/5xx — OGS returned an error. Status set to FAILED. The full <code>bapiResponse</code> message is stored so operators can diagnose the issue without checking SAP directly.', show: ["n-failed","e-status-failed"] },
    { desc: '<span class="tag orange">PENDING_ABAP</span> HTTP 405 — the CREATE operation is not yet exposed on ZTANK_DIP_SRV_SRV. Record is stored safely in CAP with status PENDING_ABAP. Can be re-submitted once the ABAP team exposes the endpoint. No data loss.', show: ["n-pending","e-status-pending"] },
    { desc: '<span class="tag green">RECONCILE</span> A successful post automatically triggers the <b>M1–M6 Reconciliation Pipeline</b> for that plant and date. The operator can see the variance result on the dashboard within seconds.', show: ["n-recon","e-posted-recon"] },

// ── SLIDE 3: ETA Agent ────────────────────────────────────────────────────────
{
  num: "04 / 04",
  title: "TSW Nomination ETA Agent",

  steps: [
    { desc: '<span class="tag">START</span> The supervisor opens the <b>TSW Nomination Agent</b> page in the React dashboard and types a nomination number. The LangGraph agent begins a 9-step data-gathering process before proposing any ETA.', show: ["n-chat","e-chat-s1"] },
    { desc: '<span class="tag green">STEP 1</span> <b>Fetch Nomination</b> — calls CAP proxy → OGS_S4 Destination → ZTANK_DIP_SRV_SRV / NominationSet (via BAPI_TSW_NOM_GETLIST). Retrieves material, location, transport system, nominated quantity, and scheduled date.', show: ["n-s1","e-s1-s2"] },

    { desc: '<span class="tag green">STEP 3</span> <b>Historical Patterns</b> — analyses all past nominations for the same material + location + transport system combination. Computes average lead times to establish a baseline ETA from historical data.', show: ["n-s3","e-s3-s4"] },
    { desc: '<span class="tag green">STEP 4</span> <b>Carrier Performance</b> — scores the carrier\'s on-time record across all historical nominations. Rates from RELIABLE to HIGH_RISK. A HIGH_RISK carrier adds a buffer to the ETA.', show: ["n-s4","e-s4-s5"] },
    { desc: '<span class="tag orange">STEP 5</span> <b>Geopolitical Risk</b> — scans the <b>GDELT News API</b> for 30 days of headlines near the destination port around the scheduled date. Detects strikes, hurricanes, sanctions, port closures, and accidents. Risk levels: None / Low / Medium / High → adds 0–6 day buffer.', show: ["n-s5","e-s5-s6"] },

    { desc: '<span class="tag purple">STEP 7</span> <b>Present ETA Report</b> — displays a full ETA card in the chat: proposed date, confidence score, reasoning narrative, and evidence from each of the 5 data sources. Asks the supervisor for approval.', show: ["n-s7","n-dec","e-s7-dec"] },
    { desc: '<span class="tag green">APPROVED</span> Supervisor approves the ETA. The agent writes <b>5 values to S/4HANA</b>: the ETA itself plus 4 event dates — Loading, Berthing at destination, Discharge, and Departure. These update the nomination record in TSW.', show: ["n-appr","n-end","e-dec-appr","e-appr-end"] },
    { desc: '<span class="tag red">REJECTED</span> Supervisor rejects with a reason. The agent records the reason, runs a deep historical reassessment, and presents <b>3 alternative ETAs</b> (conservative, likely, optimistic). The supervisor can approve one of the alternatives or reject again.', show: ["n-rej","e-dec-rej","e-rej-s7"] },
  ],
  svg: buildETASVG

// ═══════════════════════════════════════════════════════════
// SVG BUILDERS
// Each returns an SVG string with data-id attributes on
// every node and edge group. Initially opacity:0.
// ═══════════════════════════════════════════════════════════

function svg(w, h, content) {
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto">${content}</svg>`;
}

// ── colour palette ────────────────────────────────────────
const C = {
  blue:   { fill:"#1e3a5f", stroke:"#4f8ef7", text:"#a8c8ff" },
  green:  { fill:"#1a3d2b", stroke:"#34c98a", text:"#86efbe" },
  orange: { fill:"#3d2a0f", stroke:"#f5a623", text:"#fcd48a" },
  red:    { fill:"#3d1515", stroke:"#e05555", text:"#ffaaaa" },
  purple: { fill:"#2a1f3d", stroke:"#a78bfa", text:"#d4bbff" },
  grey:   { fill:"#1e2130", stroke:"#4a5068", text:"#8892a4" },
};

function node(id, x, y, w, h, label, color, shape="rect", extra="") {
  const {fill,stroke,text} = C[color]||C.blue;
  const lines = label.split('\n');
  const lh = 16, pad = 10;
  const th = lines.length * lh;
  const ty = y + h/2 - th/2 + 11;

  let bg;
  if (shape === "diamond") {
    const cx=x+w/2, cy=y+h/2;
    bg = `<polygon points="${cx},${y} ${x+w},${cy} ${cx},${y+h} ${x},${cy}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
  } else if (shape === "oval") {
    bg = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" ry="${h/2}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
  } else {
    bg = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
  }

  const texts = lines.map((l,i) =>
    `<text x="${x+w/2}" y="${ty + i*lh}" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="${text}" ${i===0&&lines.length>1?'font-weight="600"':''}>${l}</text>`
  ).join('');

  return `<g class="step-node" data-id="${id}" ${extra}>${bg}${texts}</g>`;
}

function edge(id, d, color="#4f8ef7", label="", lx=0, ly=0) {
  const lbl = label ? `<text x="${lx}" y="${ly}" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#8892a4">${label}</text>` : '';
  return `<g class="step-edge" data-id="${id}">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" marker-end="url(#arr)"/>
    ${lbl}
  </g>`;
}

function defs() {
  return `<defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4f8ef7"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34c98a"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e05555"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f5a623"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
    </marker>
  </defs>`;
}

// ── helpers ───────────────────────────────────────────────
function line(x1,y1,x2,y2){return`M${x1},${y1} L${x2},${y2}`;}
function down(x,y1,y2){return`M${x},${y1} L${x},${y2}`;}
function right(x1,y,x2){return`M${x1},${y} L${x2},${y}`;}
function elbow(x1,y1,x2,y2){return`M${x1},${y1} L${x1},${y2} L${x2},${y2}`;}
function elbowR(x1,y1,x2,y2){return`M${x1},${y1} L${x2},${y1} L${x2},${y2}`;}

// ── group background box ──────────────────────────────────
function groupBg(id,x,y,w,h,label,color,textColor="#8892a4",extra="") {
  return `<g class="step-node" data-id="${id}" ${extra}>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${color}" stroke="${textColor}" stroke-width="1" stroke-dasharray="6 3" opacity="0.5"/>
    <text x="${x+12}" y="${y+18}" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="${textColor}" letter-spacing="0.05em">${label}</text>
  </g>`;
}

// SLIDE 3 — ETA Agent SVG
// Layout:  steps column centred at cx=390
//          Approve branch goes LEFT  (min x = 390-70-20-220 = 80 > 0 ✓)
//          Reject  branch goes RIGHT (max x = 390+70+20+220 = 700 < W=980 ✓)
// ═══════════════════════════════════════════════════════════
function buildETASVG() {
  const cx=390, lw=300, lx=cx-lw/2; // lx=240
  let s = defs();

  const steps = [
    ["n-chat","TRIGGER — Supervisor types nomination number",  "green","oval"],
    ["n-s1",  "Step 1 — Fetch Nomination\nCAP→OGS_S4→NominationSet\nMaterial/Location/Transport/Date","blue","rect"],
    ["n-s2",  "Step 2 — Live Vessel Tracking\nMyShipTracking AIS\n/port/estimate + /vessel/search","blue","rect"],
    ["n-s3",  "Step 3 — Historical Patterns\nSame material + location + transport\nAverage lead time from prior records","blue","rect"],
    ["n-s4",  "Step 4 — Carrier Performance\nScore on-time record\nRELIABLE → HIGH_RISK","blue","rect"],
    ["n-s5",  "Step 5 — Geopolitical Risk (GDELT)\n30-day news scan near port\nAdds 0–6 day risk buffer","orange","rect"],
    ["n-s6",  "Step 6 — Calculate ETA\nPriority: AIS > Historical > Scheduled\nConfidence: High / Medium / Low","green","rect"],
    ["n-s7",  "Step 7 — Present ETA Report\nETA card + evidence + confidence\nAsk supervisor for approval","green","rect"],
  ];

  let y = 15;
  const nodeH=65, gap=10;
  const ids = [];
  steps.forEach(([id,label,color,shape]) => {
    const h = (shape==="oval") ? 46 : nodeH;
    s += node(id, lx, y, lw, h, label, color, shape);
    ids.push({id, y, h});
    y += h + gap;
  });

  // Chain arrows down the spine
  for (let i=0; i<ids.length-1; i++) {
    const cur=ids[i], nxt=ids[i+1];
    s += edge(
      `e-${cur.id.replace('n-','')}-${ids[i+1].id.replace('n-','')}`,
      down(cx, cur.y+cur.h, nxt.y), "#4f8ef7"
    );
  }

  // Decision diamond — centred under the steps
  const decY = y + 10;
  const decCx = cx;
  s += node("n-dec", decCx-70, decY, 140, 65, "Supervisor\ndecision","orange","diamond");
  s += edge("e-s7-dec", down(decCx, ids[ids.length-1].y+ids[ids.length-1].h, decY), "#4f8ef7");

  // ── Approve branch — goes LEFT then down ──────────────────
  // Approve box: left of diamond, same y row+offset
  const apprX  = 30;                   // left edge of approve box (x=30, safe)
  const apprW  = 210;
  const apprY  = decY + 100;
  s += node("n-appr", apprX, apprY, apprW, 80,
    "APPROVED\nWrite ETA + 4 event dates\nto S/4HANA:\nLoading / Berthing / Discharge / Departure","green");

  // Path: exit left of diamond → go left → drop down to appr
  const apprCx = apprX + apprW/2;
  s += edge("e-dec-appr",
    `M${decCx-70},${decY+32} L${apprCx},${decY+32} L${apprCx},${apprY}`,
    "#34c98a", "Approve", apprCx-28, decY+26);

  // End terminal below approve
  const endY = apprY + 105;
  s += node("n-end", apprX, endY, apprW, 46,
    "ETA recorded in S/4HANA","green","oval");
  s += edge("e-appr-end", down(apprCx, apprY+80, endY), "#34c98a");

  // ── Reject branch — goes RIGHT then down ─────────────────
  const rejX = decCx + 100;            // right of diamond
  const rejW = 210;
  const rejY = decY + 10;
  s += node("n-rej", rejX, rejY, rejW, 85,
    "REJECTED\nRecord reason\nDeep reassessment\nPresent 3 alternative ETAs","red");

  // Path: exit right of diamond → enter left of rej
  s += edge("e-dec-rej",
    `M${decCx+70},${decY+32} L${rejX},${decY+32}`,
    "#e05555", "Reject", decCx+88, decY+24);

  // Reject loops back up to Step 7 — runs up the far-right rail
  const s7 = ids[7];
  const railX = rejX + rejW + 30;      // far-right rail x
  s += edge("e-rej-s7",
    `M${rejX+rejW/2},${rejY} L${rejX+rejW/2},${decY-10} L${railX},${decY-10} L${railX},${s7.y+s7.h/2} L${lx+lw},${s7.y+s7.h/2}`,
    "#e05555", "re-present 3 alternatives", railX+8, decY-18, );

  // Compute canvas height: max of (end terminal bottom, rej box bottom, loop rail)
  const H = Math.max(endY + 46, rejY + 85, decY + 100) + 40;
  // Width: rail goes to railX = rejX+rejW+30 = cx+100+210+30 = cx+340
  const W = railX + 40;

  return svg(W, H, s);
}

// ═══════════════════════════════════════════════════════════

let currentSlide = 0;
let currentStep  = -1;   // -1 = nothing revealed yet
let autoTimer    = null;

function buildSlide(i) {
  const s = SLIDES[i];
  const svgHTML = s.svg();
  return `
    <div class="slide-header">
      <div class="slide-num">${s.num}</div>
      <div class="slide-title">${s.title}</div>
      <div class="slide-sub">${s.sub}</div>
    </div>
    <div class="flow-wrapper">
      <div class="flow-body">
        <div class="diagram">${svgHTML}</div>
        <div class="side-panel">
          <div class="step-desc" id="stepDesc">Click <b>Next Step →</b> to begin the walkthrough.</div>
          <div class="step-counter" id="stepCounter">Step 0 / ${s.steps.length}</div>
        </div>
      </div>
    </div>`;
}

function renderSlide(i) {
  const stage = document.getElementById('stage');

  // Remove any existing active slide with leave animation
  const existing = stage.querySelector('.slide.active');
  if (existing) {
    existing.classList.add('leaving');
    setTimeout(() => existing.remove(), 300);
  }

  const div = document.createElement('div');
  div.className = 'slide active';
  div.innerHTML = buildSlide(i);
  stage.appendChild(div);

  currentSlide = i;
  currentStep  = -1;
  updateDots();
  updateButtons();
  updateProgress();
}

function navigate(dir) {
  const next = currentSlide + dir;
  if (next < 0 || next >= SLIDES.length) return;
  renderSlide(next);
}

function revealElement(el, idx) {
  if (!el) return;
  const isEdge = el.classList.contains('step-edge');
  if (isEdge) {
    // Determine the path element (could be the element itself or a child <path>/<line>)
    const pathEl = (el.tagName === 'path' || el.tagName === 'line' || el.tagName === 'polyline')
      ? el
      : el.querySelector('path, line, polyline');
    const len = pathEl ? Math.ceil(pathEl.getTotalLength()) + 10 : 600;
    // Set dash properties before making visible
    pathEl && (pathEl.style.strokeDasharray = len);
    pathEl && (pathEl.style.strokeDashoffset = len);
    el.style.opacity = '1';
    // Inject keyframe animation inline
    const animName = `drawLine_${len}`;
    if (!document.getElementById(animName)) {
      const style = document.createElement('style');
      style.id = animName;
      style.textContent = `@keyframes ${animName} { from { stroke-dashoffset: ${len}; } to { stroke-dashoffset: 0; } }`;
      document.head.appendChild(style);
    }
    if (pathEl) {
      pathEl.style.animation = 'none';
      void pathEl.offsetWidth; // force reflow
      pathEl.style.animationDelay = `${idx * 80}ms`;
      pathEl.style.animation = `${animName} 0.55s ease forwards`;
    }
    el.classList.add('shown');
  } else {
    el.style.animationDelay = `${idx * 80}ms`;
    el.classList.add('shown');
  }
}

function nextStep() {
  const s = SLIDES[currentSlide];
  if (currentStep >= s.steps.length - 1) {
    if (currentSlide < SLIDES.length - 1) navigate(1);
    return;
  }

  // Dim all currently shown edges (focus shifts to the new step)
  document.querySelectorAll('.step-edge.shown').forEach(el => el.classList.add('dimmed'));

  currentStep++;
  const step = s.steps[currentStep];

  // Reveal new elements
  step.show.forEach((id, idx) => {
    setTimeout(() => {
      const el = document.querySelector(`[data-id="${id}"]`);
      if (el) revealElement(el, idx);
    }, idx * 80);
  });

  // Update description
  setTimeout(() => {
    const desc = document.getElementById('stepDesc');
    if (desc) {
      desc.style.opacity = 0;
      setTimeout(() => {
        desc.innerHTML = step.desc;
        desc.style.opacity = 1;
      }, 150);
    }
  }, 100);

  const counter = document.getElementById('stepCounter');
  if (counter) counter.textContent = `Step ${currentStep + 1} / ${s.steps.length}`;

  updateButtons();
  updateProgress();
}

function prevStep() {
  if (currentStep <= 0) return;
  currentStep--;
  replayUpToCurrentStep();
}

function replayUpToCurrentStep() {
  // Re-render the slide SVG from scratch (wipes all shown/dimmed state)
  const stage = document.getElementById('stage');
  const div = stage.querySelector('.slide.active');
  if (div) div.innerHTML = buildSlide(currentSlide);

  const s = SLIDES[currentSlide];

  // Replay steps 0..currentStep with zero animation delay (instant)
  for (let i = 0; i <= currentStep; i++) {
    const step = s.steps[i];
    const isLast = (i === currentStep);
    step.show.forEach((id) => {
      const el = document.querySelector(`[data-id="${id}"]`);
      if (!el) return;
      if (el.classList.contains('step-edge')) {
        const pathEl = (el.tagName === 'path' || el.tagName === 'line' || el.tagName === 'polyline')
          ? el : el.querySelector('path, line, polyline');
        const len = pathEl ? Math.ceil(pathEl.getTotalLength()) + 10 : 600;
        if (pathEl) {
          pathEl.style.strokeDasharray = len;
          pathEl.style.strokeDashoffset = 0;
          pathEl.style.animation = 'none';
        }
        el.style.opacity = isLast ? '1' : '0.18';
        el.classList.add('shown');
        if (!isLast) el.classList.add('dimmed');
      } else {
        el.style.animationDelay = '0ms';
        el.style.animation = 'none';
        el.style.opacity = '1';
        el.style.transform = 'scale(1)';
        el.classList.add('shown');
      }
    });
  }

  // Update description to current step
  const step = s.steps[currentStep];
  const desc = document.getElementById('stepDesc');
  if (desc) { desc.innerHTML = step.desc; desc.style.opacity = '1'; }
  const counter = document.getElementById('stepCounter');
  if (counter) counter.textContent = `Step ${currentStep + 1} / ${s.steps.length}`;

  updateButtons();
  updateProgress();
}

function updateButtons() {
  const s = SLIDES[currentSlide];
  document.getElementById('prevBtn').disabled = currentSlide === 0;
  document.getElementById('prevStepBtn').disabled = currentStep <= 0;
  document.getElementById('nextSlideBtn').disabled = currentSlide === SLIDES.length - 1;
  const nb = document.getElementById('nextStepBtn');
  if (currentStep >= s.steps.length - 1) {
    nb.textContent = currentSlide < SLIDES.length - 1 ? 'Next Chart →' : 'Done ✓';
  } else {
    nb.textContent = 'Next Step →';
  }
}

function updateDots() {
  const container = document.getElementById('navDots');
  container.innerHTML = '';
  SLIDES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentSlide ? ' active' : i < currentSlide ? ' done' : '');
    d.title = SLIDES[i].title;
    d.onclick = () => renderSlide(i);
    container.appendChild(d);
  });
}

function updateProgress() {
  const total = SLIDES.reduce((sum, s) => sum + s.steps.length, 0);
  const done  = SLIDES.slice(0, currentSlide).reduce((sum, s) => sum + s.steps.length, 0)
                + Math.max(0, currentStep + 1);
  document.getElementById('progressFill').style.width = `${(done / total) * 100}%`;
}

function toggleAuto() {
  const btn = document.getElementById('autoBtn');
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    btn.textContent = '▶ Auto Play';
    btn.classList.remove('playing');
  } else {
    btn.textContent = '⏸ Pause';
    btn.classList.add('playing');
    autoTimer = setInterval(() => {
      const s = SLIDES[currentSlide];
      if (currentStep >= s.steps.length - 1) {
        if (currentSlide < SLIDES.length - 1) {
          renderSlide(currentSlide + 1);
        } else {
          toggleAuto(); // stop at end
        }
      } else {
        nextStep();
      }
    }, 1800);
  }
}

// ── Init ──────────────────────────────────────────────────
renderSlide(0);
</script>
</body>
</html>
