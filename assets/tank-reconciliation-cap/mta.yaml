_schema-version: '3.1'
ID: tank-reconciliation-cap
version: 1.0.0
description: "Tank Stock Reconciliation CAP backend - SQLite + Node.js service"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm run custom_build

modules:
  # -- CAP Node.js service ----------------------------------------------------
  - name: tank-reconciliation-cap-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
      build-result: .
    provides:
      - name: srv-api
        properties:
          srv-url: '${default-url}'
    requires:
      - name: tank-reconciliation-xsuaa
      - name: tank-reconciliation-destination

resources:
  # -- XSUAA (app-level auth) -------------------------------------------------
  - name: tank-reconciliation-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  # -- Destination service ----------------------------------------------------
  - name: tank-reconciliation-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
